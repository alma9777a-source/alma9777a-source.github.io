<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>결제 결과 — 남은 조각</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=202610272200">
<style>
.res{padding:64px 0 96px;word-break:keep-all;text-align:center}
.res .ic{font-size:56px;line-height:1;margin-bottom:14px}
.res h1{font-family:var(--serif);font-size:clamp(28px,4vw,38px);margin-bottom:12px}
.res p{font-size:16px;color:var(--mute);margin:0 auto 10px;max-width:560px}
.card2{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:20px 24px;margin:22px auto;max-width:560px;text-align:left}
.card2 li{font-size:15.5px;margin:6px 0 6px 20px}
.kv{font-size:15px;margin:4px 0}.kv b{display:inline-block;min-width:84px;color:var(--ink)}
.acts2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
</style></head>
<body>
<nav class="nav"><div class="in"><a class="brand" href="./"><img src="icon.png" alt="">남은 조각</a>
<div class="links"><a href="./#price">가격</a><a href="terms.html">이용 약관</a></div><span></span></div></nav>
<main class="res"><div class="in narrow" id="out">
  <div class="ic">⏳</div><h1>결제를 확인하는 중입니다</h1><p>이 창을 닫지 말고 잠시만 기다려 주세요.</p>
</div></main>
<footer class="foot"><div class="in">
  <div><b><a href="studio.html">나눔스튜디오</a></b> · 문의 <a href="mailto:alma9777a@gmail.com">alma9777a@gmail.com</a> · 전화 010-8014-1279</div>
  <div class="c" style="opacity:.8">상호 나눔스튜디오 · 대표 최완수 · 사업자등록번호 252-10-03077<br>주소 경기도 수원시 권선구 칠보로 102, 103동 501호 (호매실동, 한양수자인파크원)</div>
</div></footer>
<script>
/* 토스 결제창에서 돌아온 곳: 성공이면 판매 장부(payment)가 토스에 승인을 요청해 확인한다. 승인 전까지는 돈이 나가지 않는다 */
(function(){
  var q = new URLSearchParams(location.search), out = document.getElementById("out");
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function show(ic, h, body){ out.innerHTML = '<div class="ic">' + ic + '</div><h1>' + esc(h) + '</h1>' + body; }
  var again = '<div class="acts2"><a class="btn" href="buy.html">구입 쪽으로 돌아가기</a><a class="btn ghost" href="mailto:alma9777a@gmail.com">메일로 문의하기</a></div>';
  if (q.get("fail")){
    var cancel = q.get("code") === "PAY_PROCESS_CANCELED" || q.get("code") === "USER_CANCEL";
    show(cancel ? "↩️" : "⚠️", cancel ? "결제를 취소했습니다" : "결제가 되지 않았습니다",
      '<p>' + (cancel ? "돈은 나가지 않았습니다. 다시 결제하시려면 구입 쪽으로 돌아가 주세요." : esc(q.get("message") || "결제 중 문제가 생겼습니다.") + " — 돈은 나가지 않았습니다.") + '</p>' + again);
    return;
  }
  var body = { action: "payment", paymentKey: q.get("paymentKey"), orderId: q.get("orderId"), amount: Number(q.get("amount")) };
  if (!body.paymentKey || !body.orderId){ show("⚠️", "결제 정보가 없습니다", '<p>구입 쪽에서 다시 시작해 주세요.</p>' + again); return; }
  fetch("version.json?t=" + Date.now()).then(function(r){ return r.json(); })
    .then(function(v){ return fetch(v.license_api, { method: "POST", body: JSON.stringify(body) }); })
    .then(function(r){ return r.json(); })
    .then(function(r){
      if (!r.ok){ show("⚠️", "결제를 마치지 못했습니다", '<p>' + esc(r.error) + '</p><p>카드에서 돈이 빠져나간 것처럼 보이면 주문 번호 <b>' + esc(body.orderId) + '</b>를 적어 메일로 알려 주세요. 확인해서 등록하거나 돌려 드립니다.</p>' + again); return; }
      show("🧺", "결제가 끝났습니다",
        (r.test ? '<p><b>(시험 결제 — 실제로 돈이 나가지 않았습니다)</b></p>' : '') +
        '<p>감사합니다. 등록 안내 메일을 보내 드렸습니다.</p>' +
        '<div class="card2"><ol><li>등록할 기기에서 <b>남은 조각</b>을 엽니다.</li><li>위쪽의 ‘무료 사용 ○일 남음 · 등록’을 눌러 등록 화면을 엽니다.</li><li><b>[등록 확인]</b>을 누르면 바로 등록됩니다.</li></ol>' +
        '<p class="kv"><b>기기 번호</b> ' + esc(r.machine) + '</p><p class="kv"><b>구매 번호</b> ' + esc(r.key) + '</p><p class="kv"><b>주문 번호</b> ' + esc(body.orderId) + '</p>' +
        '<p style="font-size:13.5px;color:var(--mute);margin-top:8px">[등록 확인]이 안 되면 구매 번호를 앱 등록 화면의 코드 칸에 넣어도 됩니다.</p></div>' +
        '<div class="acts2"><a class="btn" href="./">처음으로</a></div>');
    })
    .catch(function(){ show("⚠️", "결제 확인에 연결하지 못했습니다", '<p>인터넷 연결을 확인하고 이 쪽을 새로 고침해 주세요. 같은 결제가 두 번 되지는 않습니다.</p><p>계속 안 되면 주문 번호 <b>' + esc(body.orderId) + '</b>를 적어 메일로 알려 주세요.</p>' + again); });
})();
</script>
</body></html>
