<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>핏처치 체험판 — 교회 행정 프로그램 | 나눔스튜디오</title>
<link rel="canonical" href="https://namunjogak.com/studio/fitchurch.html">
<link rel="icon" href="img/fitchurch.svg">
<meta name="description" content="중소형 교회에 꼭 맞춘 행정 프로그램 핏처치(Fit Church)를 가상의 교회로 눌러 보는 체험판입니다.">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 핏처치(옛 이름 사역 행정) 기본 디자인(2026-10-26 캔버스)의 색 · 글꼴 · 배치를 따름 */
:root{--ac:#24407A;--ac2:#1A2F5A;--acbg:#EEF2FA;--bg:#F5F6F8;--card:#fff;--ink:#1B2230;--ink2:#3A4352;--mute:#5B6474;--line:#E3E6EB;--line2:#D5D9E0;--ok:#2E7D4F;--okbg:#E7F3EC;--warn:#8A5A0E;--warnbg:#FDF4E3;--red:#A33A2E;--redbg:#FBEAE7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"IBM Plex Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);word-break:keep-all;font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.demo{background:var(--ac);color:#fff;font-size:13px;text-align:center;padding:8px 12px}
.demo b{color:#FFE7A8}.demo a{color:#fff;margin-left:12px;font-weight:600}
.app{display:flex;min-height:calc(100vh - 37px)}
/* 왼쪽 메뉴 */
.side{width:248px;flex:none;background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:20px}
.who{display:flex;align-items:center;gap:12px;padding:0 8px}
.who .mk{width:40px;height:40px;border-radius:12px;background:var(--ac);display:grid;place-items:center}
.who b{display:block;font-size:15px}.who span{font-size:12px;color:var(--mute)}
.menu{display:flex;flex-direction:column;gap:2px}
.menu button{display:flex;align-items:center;gap:12px;min-height:42px;padding:0 12px;border-radius:10px;background:none;border:0;color:var(--ink2);font-size:14px;text-align:left}
.menu button.sub{min-height:36px;padding-left:44px;color:var(--mute);font-size:13px}
.menu button svg{width:20px;height:20px;flex:none}
.menu button:hover{background:#F3F5F8}
.menu button.on{background:var(--acbg);color:var(--ac);font-weight:600}
.vault{border-top:1px solid var(--line);padding-top:12px}
.vault .lk{display:flex;align-items:center;gap:6px;padding:0 12px 6px;font-size:11.5px;font-weight:700;color:var(--warn)}
.store{padding:12px;border-radius:12px;background:var(--bg);font-size:12px;color:var(--mute);margin-top:auto}
.store b{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);margin-top:2px}
.store b i{width:8px;height:8px;border-radius:4px;background:var(--ok)}
.me{display:flex;align-items:center;gap:10px;padding:0 8px}
.me .av{background:#DCE3F2;color:var(--ac)}
.me select{border:1px solid var(--line2);border-radius:8px;padding:3px 6px;font-size:12px;background:#fff;color:var(--mute)}
/* 본문 */
main{flex:1;min-width:0;padding:32px 40px 60px;display:flex;flex-direction:column;gap:24px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.head p{font-size:13px;color:var(--mute)}
.head h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.btn{height:44px;padding:0 18px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--ac2)}
.btn.gh{background:#fff;color:var(--ink2);border:1px solid var(--line2)}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:10px 14px;font-size:14px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.card h2{font-size:17px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card h2 small{font-size:12.5px;font-weight:500;color:var(--mute)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{padding:20px}
.stat small{font-size:13px;color:var(--mute)}
.stat b{display:block;font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:12.5px;color:var(--mute)}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap;display:inline-block}
.p-ok{background:var(--okbg);color:var(--ok)}.p-w{background:var(--warnbg);color:var(--warn)}.p-r{background:var(--redbg);color:var(--red)}.p-a{background:var(--acbg);color:var(--ac)}.p-g{background:#EEF0F3;color:var(--ink2)}
.av{width:34px;height:34px;border-radius:50%;background:var(--acbg);color:var(--ac);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.rows{list-style:none}
.rows li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #EEF0F3}
.rows li:first-child{border-top:0;padding-top:0}
.rows .l{display:flex;align-items:center;gap:12px;min-width:0}
.mute{color:var(--mute);font-size:13px}
/* 준비 단계 */
.steps{list-style:none;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.steps li{display:flex;flex-direction:column;gap:6px}
.steps i{height:6px;border-radius:3px;background:var(--line)}
.steps i.d{background:var(--ac)}.steps i.h{background:#9DB0D6}
.steps b{font-size:14px;font-weight:600}.steps span{font-size:12px;color:var(--mute)}
.steps span.d{color:var(--ok)}
/* 막대 */
.bars{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:20px}
.bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.bars i{width:100%;max-width:38px;background:#BFCBE3;border-radius:6px 6px 2px 2px;position:relative}
.bars i.last{background:var(--ac)}
.bars i em{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-style:normal;font-size:12px;font-weight:600}
.bars span{font-size:12px;color:var(--mute)}
/* 표 */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tools input,.tools select{height:40px;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:0 12px}
.tools input{flex:1;min-width:180px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:12.5px;color:var(--mute);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid #EEF0F3;font-variant-numeric:tabular-nums}
tbody tr.ck{cursor:pointer}tbody tr.ck:hover{background:#F7F9FC}
.num{text-align:right}
.dots{display:flex;gap:4px}.dots i{width:10px;height:10px;border-radius:50%;background:#E3E6EB}.dots i.on{background:var(--ac)}
/* 출석 */
.att{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.att button{border:1px solid var(--line2);background:#fff;border-radius:10px;min-height:46px;padding:0 12px;text-align:left;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.att button small{color:var(--mute);font-size:11.5px}
.att button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.att button.on small{color:#C9D4EC}
.grp{margin:18px 0 8px;font-weight:600;display:flex;gap:10px;align-items:center}
.grp span{font-weight:400;color:var(--mute);font-size:13px}
.lock{display:flex;gap:10px;align-items:flex-start;background:var(--warnbg);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:13px}
.lock svg{flex:none;margin-top:2px}
/* 옆 창 */
.sheet{position:fixed;inset:0;background:rgba(27,34,48,.32);display:none;justify-content:flex-end;z-index:20}
.sheet.open{display:flex}
.panel{width:min(480px,100%);background:var(--bg);height:100%;overflow:auto;padding:24px 24px 40px;box-shadow:-12px 0 40px rgba(0,0,0,.14)}
.panel .x{float:right;border:1px solid var(--line2);background:#fff;border-radius:10px;width:40px;height:40px;font-size:16px}
.panel h3{font-size:22px;display:flex;gap:12px;align-items:center}
.panel h4{font-size:14px;margin:22px 0 8px}
.kv{background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 16px;margin-top:14px}
.kv div{display:flex;padding:10px 0;border-top:1px solid #EEF0F3}.kv div:first-child{border-top:0}
.kv b{width:84px;color:var(--mute);font-weight:500;flex:none}
.hidebox{background:#fff;border:1px dashed var(--line2);border-radius:12px;padding:14px;color:var(--mute);font-size:13px;display:flex;gap:8px;align-items:center}
.form label{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px}
.form input,.form select,.form textarea{width:100%;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:10px 12px}
.form .r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .btn{margin-top:20px;width:100%;justify-content:center}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;opacity:0;transition:.2s;z-index:30;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.kbar{display:flex;flex-direction:column;gap:10px}
.kbar div{display:grid;grid-template-columns:64px minmax(0,1fr) 60px;gap:10px;align-items:center;font-size:13.5px}
.kbar .tr{display:block;height:10px;background:#EEF0F3;border-radius:5px}
.kbar s{display:block;height:10px;border-radius:5px;background:var(--ac)}
.kbar b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
pre.bl{white-space:pre-wrap;background:#F7F9FC;border:1px solid var(--line);border-radius:12px;padding:14px;font:13.5px/1.8 "IBM Plex Sans KR";max-height:260px;overflow:auto}
.soon{text-align:center;padding:56px 24px}
.soon .ic{width:56px;height:56px;border-radius:16px;background:var(--acbg);color:var(--ac);display:grid;place-items:center;margin:0 auto 16px}
.soon h2{display:block;font-size:20px}
.soon p{color:var(--mute);max-width:440px;margin:6px auto 18px}
.hm{}
@media (max-width:900px){
 .bsteps{grid-template-columns:1fr 1fr!important}.wkc{grid-template-columns:1fr!important}
 .side{display:none}
 .mnav{display:flex!important}
 main{padding:20px 16px 96px}
 .g4{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}
 .steps{grid-template-columns:1fr 1fr}
 .hm{display:none}
 .head h1{font-size:24px}
}
.mnav{display:none;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:10;justify-content:space-around;padding:6px 4px}
.mnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:6px 4px;flex:1;border-radius:10px}
.mnav button.on{color:var(--ac);font-weight:600;background:var(--acbg)}
.mnav svg{width:20px;height:20px}
</style></head>
<body>
<div class="demo"><b>체험판</b> · 교회 이름 · 성도 · 금액은 모두 <b>가상의 자료</b>입니다. 마음껏 눌러 보세요(새로 고치면 처음으로). <a href="index.html">← 나눔스튜디오</a></div>
<div class="app">
<nav class="side" aria-label="주 메뉴">
  <div class="who"><img class="mk" src="img/fitchurch.svg" alt="핏처치" style="width:40px;height:40px;border-radius:11px;background:none"><div><b>은혜샘교회</b><span>핏처치 · 가상 교회</span></div></div>
  <div class="menu" id="menu1"></div>
  <div class="menu vault"><div class="lk"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="9" width="12" height="9" rx="2"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9"/></svg>재정 금고 · 담당자만</div><div id="menu2" style="display:flex;flex-direction:column;gap:2px"></div></div>
  <div class="store">저장소<b><i></i>이 컴퓨터 · 체험판</b></div>
  <div class="me"><div class="av">담</div><div><b style="font-size:14px;display:block">보는 사람</b><select id="role" aria-label="화면을 보는 사람"><option value="pastor">담임목사</option><option value="minister">교역자</option><option value="office">사무간사</option><option value="teacher">부서 교사</option><option value="fin">재정부</option></select></div></div>
</nav>
<main id="view"></main>
</div>
<nav class="mnav" id="mnav" aria-label="아래 메뉴"></nav>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>

<script>
// ── 메뉴 (기본 디자인의 메뉴 구성 그대로) ──
const IC={
home:'<path d="M3 9.5l7-6 7 6V17a1 1 0 0 1-1 1h-4v-5H8v5H4a1 1 0 0 1-1-1z"/>',
cal:'<rect x="3" y="4" width="14" height="13" rx="2"/><path d="M3 8h14M7 2v4M13 2v4"/>',
chk:'<path d="M8 5h9M8 10h9M8 15h9M3 5l1 1 2-2M3 10l1 1 2-2M3 15l1 1 2-2"/>',
book:'<path d="M4 3h9a3 3 0 0 1 3 3v11H7a3 3 0 0 1-3-3z"/><path d="M4 14a3 3 0 0 1 3-3h9"/>',
doc:'<path d="M5 2h7l4 4v12H5z"/><path d="M12 2v4h4M8 10h5M8 13h5"/>',
chat:'<path d="M3 4h14v9H8l-4 3v-3H3z"/>',
team:'<circle cx="7" cy="7" r="3"/><path d="M2 17a5 5 0 0 1 10 0"/><circle cx="14" cy="8" r="2.5"/><path d="M13 13a4 4 0 0 1 5 4"/>',
box:'<rect x="2" y="3" width="16" height="4" rx="1"/><path d="M4 7v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7M8 11h4"/>',
rcpt:'<path d="M5 2h10v16l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5z"/><path d="M8 7h4M8 10h4"/>',
ppl:'<circle cx="7.5" cy="7" r="2.6"/><path d="M2.5 16c.6-2.8 2.6-4.3 5-4.3s4.4 1.5 5 4.3"/><circle cx="14" cy="8" r="2"/><path d="M13.6 11.8c2 .1 3.4 1.4 3.9 3.6"/>',
won:'<rect x="2" y="5" width="16" height="11" rx="2"/><circle cx="10" cy="10.5" r="2.5"/>'};
const svg=k=>`<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
// [id, 이름, 아이콘(없으면 하위 메뉴), 체험 가능?, 설명]
const M1=[["home","홈","home",1],["cal","연간 일정","cal",1,"교회력과 한 해 행사를 한 달력에. 2027 계획 사이클(달력 깔기 → 큰 돌 놓기 → 부서 초안 → 정책당회)을 따라갑니다."],["plan","사역계획안",null,0,"부서별 계획안을 모아 당회 자료로 묶습니다."],["event","행사 준비","chk",1,"추수감사 · 성탄처럼 큰 행사를 D-day 할 일 목록으로 준비합니다."],["weekly","주간 사역","book",1,"설교문 · 칼럼 · 카톡 카드 · 주보 · 문자를 한 주 흐름으로 챙깁니다."],["bulletin","주보 작업",null,1,"주보 템플릿 · 편집기 · 지난 PDF 가져와 고치기."],["time","예배 타임테이블",null,0,"예배 순서와 큐시트 — 방송실 화면과 이어집니다."],["msg","문자·카톡 발송",null,0,"구역 · 부서별로 골라 문자와 카톡 카드를 보냅니다."],["forms","양식·인쇄물","doc",0,"봉투 · 증서 · 노회 서류 양식을 채워 출력합니다."],["presby","노회 서류",null,1],["meet","회의·결의","chat",0,"당회 · 제직회 회의록과 결의 사항을 남깁니다."],["share","업무 공유","team",0,"교역자 · 간사 업무 나누기와 시설 예약."],["arch","사역 아카이브","box",0,"설교 · 사진 · 행사 자료를 해마다 정리해 둡니다."],["exp","지출 청구","rcpt",0,"영수증 사진을 붙여 지출결의서를 올리고 승인합니다."]];
const M2=[["mem","성도 관리","ppl",1],["att","출석",null,1],["visit","심방",null,1],["ledger","재정 관리",null,0,"수입 · 지출 장부와 월말 결산."],["off","헌금 관리",null,1],["budget","예산안",null,0,"지난해 결산을 바탕으로 새해 예산안을 짭니다."],["rcp","기부금영수증",null,0,"연말에 성도별 기부금영수증을 한 번에 만듭니다."]];
function menuHTML(L){return L.map(([id,t,ic])=>`<button data-v="${id}" class="${ic?"":"sub"}">${ic?svg(ic):""}<span>${t}</span></button>`).join("")}
document.getElementById("menu1").innerHTML=menuHTML(M1);
document.getElementById("menu2").innerHTML=menuHTML(M2);
document.getElementById("mnav").innerHTML=[["home","홈","home"],["mem","성도","ppl"],["att","출석","chk"],["visit","심방","chat"],["off","헌금","won"]].map(([id,t,ic])=>`<button data-v="${id}">${svg(ic)}${t}</button>`).join("");

// ── 가상의 자료 (늘 같은 자료가 나오게 고정 난수) ──
let seed=20261027;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const pick=a=>a[Math.floor(rnd()*a.length)];
const SUR="김이박최정강조윤장임한오서신권황안송류홍".split("");
const GM=["민준","성호","재훈","영수","동현","준호","상철","정우","태식","현우","승민","광수","도윤","시우"];
const GF=["은혜","지영","미숙","정희","수진","영자","혜원","순자","하은","서연","경희","선영","옥자","지민"];
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const lastSun=new Date(TODAY);lastSun.setDate(TODAY.getDate()-TODAY.getDay());

      <td><span style="display:inline-flex;background:#EEF0F3;border-radius:8px;padding:2px">${["spring","fall","both"].map(o=>`<button onclick="PRRULE['${f.name}']='${o}';render()" style="border:0;border-radius:6px;padding:4px 9px;font-size:12px;${f.season===o?"background:#fff;font-weight:600;color:var(--ac)":"background:none;color:var(--mute)"}">${SEASON[o]}</button>`).join("")}</span></td>
      <td>${/현황|교세|통계/.test(f.name)?'<span class="pill p-ok">📎 1개</span>':`<button class="btn sm gh" onclick="toast('체험판에서는 파일을 올리지 않아요 — 핏처치에서는 ${DEN[prDen].b}에서 받은 원본 서식을 서류마다 올려 보관합니다')">올리기</button>`}</td></tr>`).join("")||'<tr><td colspan="3" class="mute">아직 서류가 없습니다 — ‘+ 서류 더하기’로 시작하세요</td></tr>'}</tbody></table></div></section>
  <div class="grid g2">
   <section class="card"><h2>알림</h2><p class="mute" style="margin-bottom:8px">언제</p><div style="display:flex;gap:6px;flex-wrap:wrap">${[60,30,14,7,1].map(d=>`<button class="btn sm ${PRWHEN[d]?"":"gh"}" onclick="PRWHEN[${d}]=!PRWHEN[${d}];render()">D-${d}</button>`).join("")}</div>
    <p class="mute" style="margin:16px 0 8px">어떻게</p><ul class="rows">${ways.map(([k,l,n])=>`<li><label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer"><input type="checkbox" ${PRWAY[k]?"checked":""} onchange="PRWAY['${k}']=!PRWAY['${k}'];render()" style="width:18px;height:18px;margin-top:2px;accent-color:#24407A"><span><b>${l}</b><br><span class="mute">${n}</span></span></label></li>`).join("")}</ul>
    <p class="mute" style="margin-top:12px">받는 사람 · 담임목사 · 사무간사 · 해당 교역자</p></section>
   <section class="card"><h2>휴대폰에 이렇게 옵니다 <span class="tabs" style="border:0">${[["push","앱 푸시"],["kakao","알림톡"]].map(([k,l])=>`<button class="${prPrev===k?"on":""}" onclick="prPrev='${k}';render()">${l}</button>`).join("")}</span></h2>
    <div style="max-width:320px;margin:6px auto 0;background:${prPrev==="push"?"linear-gradient(170deg,#3B4A6B,#1B2230)":"#B2C7DA"};border-radius:28px;padding:22px 14px 26px">
     ${prPrev==="push"?`<p style="text-align:center;color:#fff;font-size:12px;opacity:.85">${TODAY.getMonth()+1}월 ${TODAY.getDate()}일 ${DOW[TODAY.getDay()]}요일</p><p style="text-align:center;color:#fff;font-size:44px;font-weight:300;line-height:1.1;margin-bottom:16px">9:00</p>
      <div style="background:rgba(255,255,255,.92);border-radius:16px;padding:12px 14px;font-size:13px"><div style="display:flex;justify-content:space-between;color:var(--mute);font-size:11.5px"><span>사역 행정</span><span>지금</span></div><b style="display:block;margin:2px 0">${ttl}</b>${msg}</div>`
     :`<div style="background:#fff;border-radius:14px;overflow:hidden;font-size:13px"><div style="background:#FEE500;padding:8px 12px;font-weight:700;font-size:12px">알림톡 도착</div><div style="padding:12px 14px"><b>노회 서류 마감 안내</b><p style="margin-top:6px;white-space:pre-line">안녕하세요, 은혜샘교회 행정실입니다.\n\n${msg}\n\n· 마감: 10월 30일(금)\n· 받는 곳: [노회명] 서기</p><div style="margin-top:10px;border:1px solid #E3E6EB;border-radius:8px;text-align:center;padding:8px">앱에서 서류 보기</div></div></div><p style="font-size:11px;color:#3A4352;margin-top:6px;text-align:right">오전 9:00</p>`}
    </div>
    <p class="mute" style="margin-top:12px">${prPrev==="kakao"&&!PRWAY.kakao?"알림톡은 지금 꺼져 있어요. 왼쪽에서 켜면 이렇게 갑니다.":"위에서 ‘보냈어요’를 누르면 알림 글도 바뀝니다."}</p></section>
  </div>`;
}

function soon(){const it=[...M1,...M2].find(m=>m[0]===cur);
  $("#view").innerHTML=head("핏처치",it[1])+`<section class="card soon"><div class="ic">${svg(it[2]||"doc").replace('viewBox','width="26" height="26" viewBox')}</div><h2>${it[1]}</h2><p>${it[4]||""}</p><p style="margin-top:-8px"><span class="pill p-w">정식판에 들어갑니다</span></p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn gh" onclick="go('home')">홈으로</button><button class="btn" onclick="go('mem')">성도 관리 체험하기</button></div></section>`}
// ── 2026-11-09 역할마다 다른 메뉴: 실제 핏처치 권한표(server/perms.js) 그대로 — 0 고침 · 1 보기 · 2 없음(메뉴에서 빠짐) ──
// 순서: [담임목사, 교역자, 사무간사, 부서 교사, 재정부]
const RKEY=["pastor","minister","office","teacher","fin"],RNAME={pastor:"담임목사",minister:"교역자",office:"사무간사",teacher:"부서 교사",fin:"재정부"},RINI={pastor:"담",minister:"교",office:"간",teacher:"교사",fin:"재"};
const AREA={cal:[0,0,1,1,1],plan:[0,0,1,1,1],event:[0,0,0,0,1],weekly:[0,0,0,1,2],time:[0,0,0,1,2],bulletin:[0,0,0,2,2],msg:[0,1,0,2,2],forms:[0,0,0,1,2],presby:[0,1,0,2,2],meet:[0,1,1,2,2],share:[0,0,0,0,1],arch:[0,0,0,1,2],exp:[0,0,0,0,0],mem:[0,1,0,2,1],att:[0,1,0,2,1],visit:[0,0,2,2,2],ledger:[1,2,2,2,0],off:[1,2,2,2,0],budget:[1,2,2,2,0],rcp:[1,2,0,2,0]};
function lv(v){const a=AREA[v];return a?a[RKEY.indexOf(role)]:0}
// 역할별 ‘내 사역’ 묶음 — 실제 핏처치 메뉴(ui/app.js ROLE_MENU)처럼 맡은 일을 맨 위에, 아래 묶음에서는 뺀다
const MINE={minister:["교구 사역",["visit","att","mem"]],office:["서무",["bulletin","share","forms"]],teacher:["교육부",["plan","event","forms","exp"]],fin:["재정부",["off","exp","ledger","rcp"]]};
function applyRole(){
  const tag=id=>lv(id)===1?'<em class="ro">보기</em>':"";
  const all=[...M1,...M2],mine=MINE[role],own=mine?mine[1].filter(id=>lv(id)<2):[];
  const btns=a=>menuHTML(a).replace(/(<button data-v="([a-z]+)"[^>]*>[\s\S]*?<span>[^<]*<\/span>)/g,(m,x,id)=>x+tag(id));
  const L=a=>a.filter(m=>lv(m[0])<2&&!own.includes(m[0]));
  let box=document.getElementById("menuMine");
  if(!box){box=document.createElement("div");box.id="menuMine";box.className="menu mine";document.getElementById("menu1").before(box)}
  box.innerHTML=own.length?`<div class="mk2">내 사역 · ${mine[0]}</div>`+btns(own.map(id=>{const m=all.find(x=>x[0]===id);return [m[0],m[1],m[2]||"doc"]})):"";
  box.style.display=own.length?"":"none";
  document.getElementById("menu1").innerHTML=btns(L(M1));
  const m2=L(M2);document.getElementById("menu2").innerHTML=btns(m2);
  document.querySelector(".menu.vault").style.display=m2.length?"":"none";
  document.querySelectorAll("#mnav [data-v]").forEach(b=>b.style.display=lv(b.dataset.v)<2?"":"none");
  const av=document.querySelector(".me .av");if(av)av.textContent=RINI[role];
  document.querySelectorAll(".menu [data-v]").forEach(b=>b.onclick=()=>go(b.dataset.v));
  go(lv(cur)<2?cur:"home");
}
const roleCss=document.createElement("style");roleCss.textContent=`.menu em.ro{font-style:normal;margin-left:auto;font-size:10.5px;font-weight:600;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 7px}
.menu.mine{padding:0 0 10px;border-bottom:1px solid var(--line);margin-bottom:6px}.menu.mine .mk2{padding:0 12px 6px;font-size:11.5px;font-weight:700;color:var(--ac)}
.viewonly{margin:-4px 0 14px;padding:9px 14px;border-radius:10px;background:#FDF4E3;color:#8A5A0E;font-size:13px}`;document.head.append(roleCss);
// ── 2026-11-09 주보: 행복드림 디자인 스튜디오(실제 핏처치의 주보 편집기 ui/studio)를 그대로 ──
VIEWS.bulletin=function(){
  $("#view").innerHTML=head("주간 사역","주보 작업 · 디자인 스튜디오",`<button class="btn gh" onclick="demoOnly('정식판에서는 이번 주 설교 · 예배 순서 · 교회 소식이 저절로 채워지고 핏처치에 저장됩니다')">이번 주 내용으로 채우기</button>`)+
  `<p class="mute" style="margin:-6px 0 12px">핏처치에 들어 있는 주보 편집기 ‘행복드림 디자인 스튜디오’를 그대로 넣었습니다. 글자를 눌러 고치고, 사진 · 도형 · 페이지를 바꾸고, PDF로 내보내 보세요. 고친 내용은 이 브라우저에만 남습니다.</p>
  <div class="card" style="padding:0;overflow:hidden;height:calc(100vh - 210px);min-height:560px"><iframe id="sframe" src="fitchurch-studio.html" title="행복드림 디자인 스튜디오" style="width:100%;height:100%;border:0;display:block"></iframe></div>`;
  const fr=$("#sframe");fr.onload=async()=>{  // 템플릿 예시의 교회 이름을 체험판 교회로
    for(let i=0;i<120;i++){const w=fr.contentWindow;if(w&&w.__ed&&w.__ed.canvas&&w.__ed.canvas.getObjects().length){try{let n=0;const walk=o=>{if(o.getObjects)o.getObjects().forEach(walk);if(typeof o.text==="string"&&o.text.includes("행복드림교회")){o.set("text",o.text.replace(/행복드림교회/g,"은혜샘교회"));n++}};w.__ed.canvas.getObjects().forEach(walk);if(n)w.__ed.canvas.requestRenderAll()}catch(e){}return}await new Promise(r=>setTimeout(r,150))}};
};
applyRole();
go(VIEWS[location.hash.slice(1)]?location.hash.slice(1):"home");   // 주소 끝 #msg 처럼 바로 그 메뉴로
</script>
